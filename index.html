<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سیستم حقوق و دستمزد</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, sans-serif; margin: 0; padding: 0; }
    body { background-color: #007a64; color: #333; min-height: 100vh; }

    /* صفحه ورود */
    #login-page {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 360px;
      border-radius: 16px;
      padding: 30px 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
    }
    .login-card h2 { color: #007a64; margin-bottom: 8px; font-size: 22px; }
    .login-card p { color: #666; font-size: 12px; margin-bottom: 20px; }
    .form-group { text-align: right; margin-bottom: 15px; }
    .form-group label { display: block; font-size: 13px; margin-bottom: 5px; color: #444; }
    .form-control {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-primary { background: #007a64; color: white; margin-top: 10px; }
    .btn-outline { background: white; border: 1px solid #007a64; color: #007a64; margin-bottom: 10px; }

    /* پنل مدیریت */
    #dashboard-page {
      display: none;
      background: #f4f7f6;
      min-height: 100vh;
    }
    header {
      background: #ffffff;
      padding: 12px 15px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .container { padding: 15px; }
    .company-box {
      background: white;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #ddd;
    }
    .company-box select {
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 13px;
    }
    .table-container {
      background: white;
      border-radius: 10px;
      overflow-x: auto;
      border: 1px solid #ddd;
    }
    table { width: 100%; border-collapse: collapse; min-width: 600px; text-align: right; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 13px; }
    th { background: #f9f9f9; }

    /* پنجره ثبت پرسنل */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 450px;
      max-height: 90vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <!-- کادر ورود -->
  <div id="login-page">
    <div class="login-card">
      <h2>حقوق و دستمزد</h2>
      <p>سامانه مدیریت پرسنل و کارگاه‌ها</p>
      
      <div class="form-group">
        <label>نام کاربری</label>
        <input type="text" id="username" class="form-control" value="admin">
      </div>
      <div class="form-group">
        <label>رمز عبور</label>
        <input type="password" id="password" class="form-control" value="admin123">
      </div>
      <button class="btn btn-primary" onclick="login()">ورود به سیستم</button>
    </div>
  </div>

  <!-- داشبورد -->
  <div id="dashboard-page">

      <button onclick="logout()" style="padding:6px 12px; background:#e74c3c; color:white; border:none; border-radius:6px; cursor:pointer;">خروج</button>
    </header>
