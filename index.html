<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سیستم حقوق و دستمزد چندشرکتی | پنل مدیریت</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #007a64;
      --primary-hover: #006250;
      --bg: #f4f7f6;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Tahoma, sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; }
    
    #login-page {
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
      background: linear-gradient(135deg, #005a4a 0%, #007a64 100%); padding: 15px;
    }
    .login-card {
      background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 20px;
      padding: 35px 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); text-align: center;
    }
    .login-icon {
      background: var(--primary); color: white; width: 55px; height: 55px;
      border-radius: 12px; display: inline-flex; align-items: center; justify-content: center;
      font-size: 24px; margin-bottom: 15px;
    }
    .form-group { text-align: right; margin-bottom: 18px; }
    .form-group label { display: block; font-size: 13px; margin-bottom: 6px; color: #666; }
    .form-control {
      width: 100%; padding: 10px 14px; border: 1px solid var(--border);
      border-radius: 10px; font-size: 14px; outline: none; transition: 0.2s;
    }
    .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,122,100,0.15); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 16px; border: none; border-radius: 10px;
      font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    .btn-primary { background: var(--primary); color: white; width: 100%; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline { background: white; border: 1px solid var(--primary); color: var(--primary); width: 100%; }
    .btn-outline:hover { background: #f0fdf9; }

    #dashboard-page { display: none; }
    header {
      background: white; border-bottom: 1px solid var(--border); padding: 10px 20px;
      display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 20;
      flex-wrap: wrap; gap: 10px;
    }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .badge-date { background: #e6f4f1; color: var(--primary); padding: 6px 12px; border-radius: 8px; font-size: 12px; }

    /* انتخابگر شرکت */
    .company-selector-box {
      display: flex; align-items: center; gap: 6px; background: #f8fafc;
      padding: 4px 8px; border-radius: 10px; border: 1px solid var(--border);
    }
    .company-selector-box select {
      border: none; background: transparent; font-size: 13px; font-weight: bold;
      color: var(--primary); outline: none; cursor: pointer;
    }

    .sidebar {
      position: fixed; top: 0; right: -280px; width: 280px; height: 100vh;
      background: #1e293b; color: white; transition: 0.3s; z-index: 100; padding: 20px 15px;
    }
    .sidebar.active { right: 0; }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .sidebar-menu { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .sidebar-menu li a {
      color: #cbd5e1; text-decoration: none; padding: 12px; border-radius: 8px;
      display: flex; align-items: center; gap: 10px; font-size: 14px; transition: 0.2s;
    }
    .sidebar-menu li.active a, .sidebar-menu li a:hover { background: var(--primary); color: white; }
