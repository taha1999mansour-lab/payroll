<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>سیستم حقوق و دستمزد</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #007a64;
      --primary-hover: #006250;
      --bg: #f4f7f6;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, Tahoma, sans-serif; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100vh; background-color: var(--bg); color: var(--text); }
    
    #login-page {
      display: flex !important;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100%;
      background: linear-gradient(135deg, #005a4a 0%, #007a64 100%);
      padding: 20px;
    }
    .login-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 380px;
      border-radius: 16px;
      padding: 30px 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
    }
    .login-icon {
      background: var(--primary);
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 12px;
    }
    .form-group { text-align: right; margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; margin-bottom: 6px; color: #555; }
    .form-control {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .form-control:focus { border-color: var(--primary); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline { background: white; border: 1px solid var(--primary); color: var(--primary); }

    #dashboard-page { display: none; width: 100%; min-height: 100vh; }
    header {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 30;
      flex-wrap: wrap;
      gap: 10px;
    }
    .header-right, .header-left { display: flex; align-items: center; gap: 8px; }
    .company-selector-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f8fafc;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .company-selector-box select {
      border: none;
      background: transparent;
      font-size: 13px;
      font-weight: bold;
      color: var(--primary);
      outline: none;
    }
    .sidebar {
      position: fixed;
      top: 0;
      right: -280px;
      width: 280px;
      height: 100vh;
      background: #1e293b;
      color: white;
      transition: 0.3s;
      z-index: 100;
      padding: 20px 15px;
    }
    .sidebar.active { right: 0; }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .sidebar-menu { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .sidebar-menu li a {
      color: #cbd5e1;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }
    .sidebar-menu li.active a { background: var(--primary); color: white; }
